<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kategori Minyak - Warung Mba Tari</title>
    <link rel="stylesheet" href="../css/style_1a.css">
</head>
<body>
    <section class="hero">
    <img src="../gambar/gambar2.png" alt="Logo Warung Sembako">
    <h1>Kategori: Minyak</h1>
    <p>Pilih merk beras yang tersedia</p>
  </section>

    <section class="produk-kami">
    <h2>Produk Beras</h2>
    <div class="container-card-flex">
      <div class="card-items">
        <img src="../gambar/gambar minyak.jpeg" alt="">
        <h3>Minyak Goreng Bimoil</h3>
        <p>Rp. 22.000/liter</p>
        <button class="beli-btn" data-produk="Minyak Goreng Bimoil">Beli Sekarang</button>
      </div>
      <div class="card-items">
        <img src="../gambar/gambar minyak.jpeg" alt="">
        <h3>Minyak Goreng Sunco</h3>
        <p>Rp. 26.000/liter</p>
        <button class="beli-btn" data-produk="Minyak Goreng Sunco">Beli Sekarang</button>
      </div>
      <div class="card-items">
        <img src="../gambar/gambar minyak.jpeg" alt="">
        <h3>Minyak Goreng Bimoli</h3>
        <p>Rp. 42.000/2 liter /kg</p>
        <button class="beli-btn" data-produk="Minyak goreng Bimoli">Beli Sekarang</button>
      </div>
      <div class="card-items">
        <img src="../gambar/gambar minyak.jpeg" alt="">
        <h3>Minyak goreng Tropical</h3>
        <p>Rp. 41.400/ 2 liter</p>
        <button class="beli-btn" data-produk="Minyak goreng Tropical">Beli Sekarang</button>
      </div>

    </div>
  </section>
  <script src="../javascript/script.js"></script>
</body>
</html>
