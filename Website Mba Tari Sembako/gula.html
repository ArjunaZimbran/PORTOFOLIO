<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kategori Gula - Warung Mba Tari</title>
    <link rel="stylesheet" href="assets/css/style_1a.css">
</head>
<body>
    <section class="hero">
    <img src="assets/gambar/gambar2.png" alt="Logo Warung Sembako">
    <h1>Kategori: Gula</h1>
    <p>Pilih merk beras yang tersedia</p>
  </section>

    <section class="produk-kami">
    <h2>Produk Gula</h2>
    <div class="container-card-flex">
      <div class="card-items">
        <img src="assets/gambar/gambar gulaku.jpeg" alt="Beras Anak Lanang">
        <h3>Gulaku 500gram</h3>
        <p>Rp. 12.000</p>
        <button class="beli-btn" data-produk="Gulaku 500gram">Beli Sekarang</button>
      </div>
      <div class="card-items">
        <img src="assets/gambar/gambar gulaku.jpeg" alt="Beras Ramos">
        <h3>Gulaku 1kg</h3>
        <p>Rp. 17.500</p>
        <button class="beli-btn" data-produk="Gulaku 1kg">Beli Sekarang</button>
      </div>
      <div class="card-items">
        <img src="assets/gambar/gambar gulaku.jpeg" alt="Beras Ramos">
        <h3>Gula Pasir Eceran</h3>
        <p>Rp. 17.500/kg</p>
        <button class="beli-btn" data-produk="Gula Pasir Eceran">Beli Sekarang</button>
      </div>
    </div>
  </section>
  <script src="assets/javascript/script.js"></script>
    
</body>
</html>
