<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kategori Beras - Warung Mba Tari</title>
    <link rel="stylesheet" href="style_1a.css">
</head>
<body>
    <section class="hero">
    <img src="../Website Mba Tari Sembako/gambar2.png" alt="Logo Warung Sembako">
    <h1>Kategori: Beras</h1>
    <p>Pilih merk beras yang tersedia</p>
  </section>

    <section class="produk-kami">
    <h2>Produk Beras</h2>
    <div class="container-card-flex">
      <div class="card-items">
        <img src="../Website Mba Tari Sembako/gambar beras.jpeg" alt="Beras Anak Lanang">
        <h3>Beras Anak Lanang</h3>
        <p>Rp. 15.500/kg</p>
        <button class="btn-beli" data-produk="Beras Anak Lanang">Beli Sekarang</button>
      </div>
      <div class="card-items">
        <img src="../Website Mba Tari Sembako/gambar beras.jpeg" alt="Beras Ramos">
        <h3>Beras MT Wangi</h3>
        <p>Rp. 19.000/kg</p>
        <button class="btn-beli" data-produk="Beras MT Wangi">Beli Sekarang</button>
      </div>
      <div class="card-items">
        <img src="../Website Mba Tari Sembako/gambar beras.jpeg" alt="Beras Ramos">
        <h3>Beras Stroop</h3>
        <p>Rp. 19.350 /kg</p>
        <button class="btn-beli" data-produk="Beras Stroop">Beli Sekarang</button>
      </div>
      <div class="card-items">
        <img src="../Website Mba Tari Sembako/gambar beras.jpeg" alt="Beras Ramos">
        <h3>Beras Ngawiti</h3>
        <p>Rp. 14.900/kg</p>
        <button class="btn-beli" data-produk="Beras Ngawiti ">Beli Sekarang</button>
      </div>

    </div>
  </section>
  <script src="script.js"></script>
</body>
</html>
